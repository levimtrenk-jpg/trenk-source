<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Licenses & credits – TRENK</title>
<meta name="description" content="The open-source components TRENK uses, their licenses and links to their source code.">
<link rel="canonical" href="https://levimtrenk-jpg.github.io/trenk/en/licenses.html">
<meta name="theme-color" content="#111319">
<link rel="stylesheet" href="../style.css">
<style>
  #notices { direction: ltr; text-align: left; }
  #notices p { white-space: pre-wrap; }
  #notices h2 { font-size: 22px; } #notices h3 { font-size: 17px; margin: 22px 0 4px; }
  details { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; margin: 6px 0; }
  summary { cursor: pointer; padding: 10px 0; font-weight: 600; direction: ltr; text-align: left; }
  .oss { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  pre { white-space: pre-wrap; font-size: 12px; direction: ltr; text-align: left; color: var(--muted); }
</style>
</head>
<body>
<a class="lang" href="../licenses.html" hreflang="he" lang="he">עברית</a>
<main class="legal">
  <a class="back" href="./">← Back to home</a>
  <div class="trenk">TRENK</div>
  <h1>Licenses & credits</h1>
  <p>TRENK is built on open-source components – thanks to everyone who wrote them! Each component has its own license.</p>
  <p class="oss"><b>TRENK is open source under GPL-3.0</b> · <a href="https://github.com/levimtrenk-jpg/trenk-source" rel="noopener">Source code on GitHub</a></p>
  <article id="notices"></article>
  <h2>Full license texts</h2>
  <div id="files"></div>
</main>
<script>
  const base = "../legal/";
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/(https?:\/\/[^\s)<]+)/g, '<a href="$1" rel="noopener">$1</a>');
  fetch(base + "THIRD_PARTY_NOTICES.md").then((r) => r.text()).then((md) => {
    document.getElementById("notices").innerHTML = md.split(/\n\s*\n/).map((b) => {
      const m = b.match(/^(#+)\s+(.*)/);
      if (!m) return "<p>" + inline(b.trim()) + "</p>";
      const h = Math.min(m[1].length + 1, 4);
      return "<h" + h + ">" + inline(m[2]) + "</h" + h + ">";
    }).join("");
  });
  fetch(base + "index.json").then((r) => r.json()).then((files) => {
    for (const f of files) {
      const d = document.createElement("details");
      d.innerHTML = "<summary>" + esc(f.replace(/\.txt$/, "")) + "</summary><pre></pre>";
      d.addEventListener("toggle", () => fetch(base + "licenses/" + f).then((r) => r.text()).then((x) => (d.querySelector("pre").textContent = x)), { once: true });
      document.getElementById("files").appendChild(d);
    }
  });
</script>
</body>
</html>
